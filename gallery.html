<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work Gallery - Ritu Construction</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
  }
  header {
    background:#333;
    color:#fff;
    padding:15px;
    text-align:center;
  }
  .container {
    max-width:1100px;
    margin:auto;
    padding:20px;
  }
  .work-item {
    background:#fff;
    padding:15px;
    margin-bottom:25px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
  }
  .work-item h3 {
    margin-bottom:10px;
    color:#1f2937;
  }
  img, video {
    width:100%;
    border-radius:6px;
  }
  a {
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
  }
</style>
</head>

<body>

<header>
  <h2>Our Site Work Gallery</h2>
  <p><a href="index.html">← Back to Home</a></p>
</header>

<div class="container">

  <!-- ===== COPY-PASTE BLOCK START ===== -->
  <div class="work-item">
    <h3>Foundation Work</h3>
    <img src="assets/images/foundation.jpg" alt="Foundation Work">
  </div>
  <!-- ===== COPY-PASTE BLOCK END ===== -->

  <div class="work-item">
    <h3>RCC Column Work</h3>
    <img src="assets/images/rcc-column.jpg" alt="RCC Column Work">
  </div>

  <div class="work-item">
    <h3>Slab Casting</h3>
    <video controls>
      <source src="assets/videos/slab-casting.mp4" type="video/mp4">
    </video>
  </div>

</div>

</body>
</html>
