 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritu Construction - Home</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .hero { background: linear-gradient(to right, #007bff, #0056b3); color: white; padding: 50px 0; }
        .card:hover { transform: scale(1.05); transition: all 0.3s; }
        footer { background-color: #007bff; color: white; text-align: center; padding: 10px 0; }
    </style>
</head>
<body>
    <!-- Navigation Bar (Added for better UX) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Ritu Construction</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Home Section (Hero - Added for intro) -->
    <section id="home" class="hero">
        <div class="container text-center">
            <h1>Welcome to Ritu Construction</h1>
            <p class="lead">Quality construction services for homes and projects.</p>
            <a href="#contact" class="btn btn-light btn-lg">Get in Touch</a>
        </div>
    </section>

    <!-- Gallery Section (Improved with cards and responsiveness) -->
    <section id="gallery" class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-4">Gallery</h2>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <img src="IMG_20251222_23443960.jpeg" class="card-img-top img-fluid" alt="Project Image 1">
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <img src="Screenshot_2025-12-22-23-38-31-64_6012fa4d4ddec268fc5c7112cbb265e7.jpg" class="card-img-top img-fluid" alt="Project Image 2">
                    </div>
                </div>
            </div>
            <div class="text-center mt-4">
                <a href="gallery.html" class="btn btn-primary">View Full Gallery</a>
            </div>
        </div>
    </section>

    <!-- Contact Section (Kept iframe, made responsive) -->
    <section id="contact" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Contact Us</h2>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <iframe 
                        src="https://docs.google.com/forms/d/e/1FAIpQLSdr87JPpqyV2vXlI5SH2x4AQ6VWrwoxc93GYNrpT4rBSqCDzA/viewform?embedded=true"
                        width="100%" 
                        height="650" 
                        style="border:1px solid #d1d5db; border-radius:6px;"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer (Improved styling) -->
    <footer>
        &copy; 2025 Ritu Construction. All rights reserved.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
